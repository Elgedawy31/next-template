services:
  next_template_dev:
    container_name: next_template_dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env.local
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: bun run dev --hostname 0.0.0.0 --port 3000
